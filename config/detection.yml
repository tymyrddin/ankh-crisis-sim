# Detection mechanisms and discovery times

mechanisms:
  guild_self_reporting:
    description: "Guilds inform the Patrician of issues in their domain"
    reliability: high
    speed: fast
    districts: [merchant_quarter]
    building_types: [guild_hq]
  watch_patrol:
    description: "Officers notice failures on their beat"
    reliability: moderate
    speed: variable
    districts: all
    frequency_by_district:
      nap_hill: high
      merchant_quarter: high
      university_precinct: moderate
      isle_of_gods: moderate
      small_gods: moderate
      the_shades: low
      cockbill_street: very_low
  citizen_complaint:
    description: "Residents report via messengers, clacks, or personal visit"
    reliability_by_district:
      nap_hill: very_high
      merchant_quarter: high
      isle_of_gods: moderate
      small_gods: low
      the_shades: none
      cockbill_street: none
    speed: slow_to_moderate
  media_investigation:
    description: "Ankh-Morpork Times reporters discover stories"
    reliability: moderate
    speed: moderate_to_fast
    bias: high_influence_districts
  tax_shortfall:
    description: "Budget office notices reduced revenue"
    reliability: high
    speed: slow
    delay_weeks: 2
  vimes_intuition:
    description: "Commander Vimes has a feeling"
    reliability: paradoxically_high
    speed: variable
    limited_to: one_district_at_time
  spontaneous_event:
    description: "Explosion, fire, collapse — hard to miss"
    reliability: 1.0
    speed: immediate
  strategic_intelligence:
    description: "Vetinari's personal network"
    reliability: very_high
    speed: fast
    capacity: limited

# Discovery time by district (hours) for non-catastrophic failures
district_base_discovery_hours:
  nap_hill: [4, 8]
  merchant_quarter: [2, 6]
  university_precinct: [6, 12]
  isle_of_gods: [12, 24]
  small_gods: [24, 48]
  the_shades: [72, 120]
  cockbill_street: [120, 240]
  river_ankh: [0, 0]              # immediate if visible, otherwise ignored

# Discovery time modifier by building type
building_type_modifiers:
  guild_hq: 0.5
  tavern: 0.8
  civic_amenity: 1.5
  slum_dwelling: 2.0
  slum_dwelling_cockbill: 3.0
  middle_class_housing: 1.0
  civic_institution: 0.3
  palace: 0.1
  university: 2.0

# Incident type discovery times (overrides district base for these)
incident_type_discovery:
  explosion_collapse:
    hours: 0
    note: "Everyone notices"
  fire:
    hours: [0, 2]
    note: "Immediate if visible, 1-2 hours if interior"
  clacks_failure:
    hours: [4, 8]
  bridge_structural:
    hours: [12, 24]               # cracks; collapse is immediate
  crime_wave:
    hours: [24, 72]
  guild_dispute:
    hours: [0, 48]               # they tell you or they don't
  supply_chain:
    hours: [72, 168]             # shortages appear gradually
  disease_outbreak:
    hours: [168, 336]            # 1-2 weeks
  strategic_interference:
    hours: [336, 9999]           # possibly never

# Vimes effect on discovery time
vimes_attention:
  nap_hill: [2, 4]
  merchant_quarter: [1, 3]
  university_precinct: [4, 8]
  isle_of_gods: [6, 12]
  small_gods: [8, 16]
  the_shades: [4, 8]
  cockbill_street: [2, 4]

# Player investments to improve detection
detection_investments:
  more_watch_patrols:
    cost_per_month: 50
    effect: discovery_time_reduction
    reduction: 0.25
    districts: [the_shades, small_gods, cockbill_street]
  citizen_reporting_incentives:
    cost_per_month: 15
    effect: complaint_frequency_increase
    increase: 0.5
    districts: [isle_of_gods, small_gods]
  clacks_redundancy:
    cost_once: 500
    effect: communications_failure_instant_detection
  guild_liaison_officers:
    cost_per_month: 30
    effect: guild_reporting_improvement
  shades_outreach:
    cost_per_month: 25
    political_cost: 8              # nobles object
    effect: discovery_time_reduction
    reduction: 0.5
    districts: [the_shades, cockbill_street]