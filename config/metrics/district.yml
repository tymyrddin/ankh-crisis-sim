# District metric templates — per-incident trust decay and per-remedy recovery rates
# These are the district-specific modifiers referenced by each district config

# Trust decay per incident type, by district archetype
trust_decay_by_incident:
  water_failure_1day:
    high_wealth: -5
    medium_wealth: -8
    low_wealth: -2               # expected it
  water_failure_1week:
    high_wealth: -30
    medium_wealth: -25
    low_wealth: -15              # started lower
  power_failure_1day:
    high_wealth: -6
    medium_wealth: -8
    low_wealth: -4               # candles substituted; workshops close but people adapt
  power_failure_1week:
    high_wealth: -25
    medium_wealth: -20
    low_wealth: -18              # prolonged darkness; workshops bankrupt; everyone suffers
  watch_delay:
    high_wealth: -15
    medium_wealth: -5
    low_wealth: -1               # never expected Watch
  bridge_closed:
    high_wealth: -8
    medium_wealth: -15
    low_wealth: -20              # can't get to jobs
  guild_strike:
    high_wealth: -10
    medium_wealth: -20
    low_wealth: -25              # more dependent on informal economy
  food_shortage:
    high_wealth: -8
    medium_wealth: -20
    low_wealth: -30              # low wealth cannot buy alternatives; no margin at all
  fire_spreading:
    high_wealth: -12
    medium_wealth: -18
    low_wealth: -25              # high density means more buildings lost; no recovery margin
  healthcare_failure:
    high_wealth: -20
    medium_wealth: -15
    low_wealth: -12              # high wealth has private physicians; low wealth had little expectation
  symbolic_failure:
    high_wealth: -5
    medium_wealth: -2
    low_wealth: -1

# Trust recovery per remedy type, by district archetype
trust_recovery_by_remedy:
  technical_restoration:
    high_wealth:
      rate_per_day: 5
      flavour: "About time"
    medium_wealth:
      rate_per_day: 3
      flavour: "Well, that's something"
    low_wealth:
      rate_per_day: 1
      flavour: "They actually fixed it?"
  resilience_investment:
    high_wealth:
      rate_per_week: 2
      flavour: "Expected standard"
    medium_wealth:
      rate_per_week: 4
      flavour: "Things might improve"
    low_wealth:
      rate_per_week: 6
      flavour: "Transformative"
  compensatory_measures:
    high_wealth:
      immediate: 8
      flavour: "Acceptable gesture"
    medium_wealth:
      immediate: 10
      flavour: "Appreciated"
    low_wealth:
      immediate: 15
      flavour: "Genuine celebration"
  accountability_actions:
    high_wealth:
      immediate: 10
      condition: "noble_blamed"
      flavour: "Justice served"
    medium_wealth:
      immediate: 5
      flavour: "Someone answered for it"
    low_wealth:
      immediate: 20
      condition: "vimes_involved"
      flavour: "Vimes came"

# Special interactions
vimes_visit:
  nap_hill: -5                   # resentment
  medium_wealth: 10              # hope
  low_wealth: 30                 # faith restored

# Global trust is weighted average of district trust
global_trust_weighting:
  by_population: 0.5
  by_influence: 0.5