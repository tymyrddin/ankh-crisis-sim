# Global simulation settings

time:
  tick_hours: 1                    # 1 tick = 1 game-hour
  ticks_per_day: 24
  term_length_days: 1460           # ~4 simulated years
  starting_day: 1
  starting_hour: 0

speed:
  seconds_per_game_hour: 1.0       # 1 real second = 1 game hour (a full day takes 24s at 1x)
  default_multiplier: 1.0
  fast_multiplier: 10.0
  max_multiplier: 50.0

starting_values:
  budget: 15000
  public_trust: 68
  regulatory_pressure: 18
  political_stability: 75
  legitimacy: 82
  public_health: 75
  crime_level: 22

budget:
  income_per_month:
    taxes_general: 500             # general taxation; reduced when public trust collapses
    guild_fees: 200
    trade_tariffs: 150             # variable, affected by transport/commerce disruption
    university_contribution: 50    # symbolic, extremely stable
    river_trade_duties: 300        # port and wharfage duties; scales with transport + food buildings
    clacks_revenue: 200            # Grand Trunk licensing fees; scales with operational clacks_tower buildings
  emergency_borrowing:
    royal_bank:
      label: "Royal Bank of Ankh-Morpork"
      available: true
      max_amount: 2000
      regulatory_pressure_cost: 15   # domestic political exposure; the guilds notice
    ueberwald:
      label: "Überwald Banking Consortium"
      available: true
      max_amount: 3000
      stability_cost: 8              # foreign strategic exposure; political stability erodes

active_districts:
  # Comment out districts to playtest with fewer
  - nap_hill
  - the_shades
  - cockbill_street
  - isle_of_gods
  - university_precinct
  - merchant_quarter
  - small_gods
  - river_ankh