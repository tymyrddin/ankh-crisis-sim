# Layer 2: Richer stories — expandable view for players who want depth
# Variables: {district}, {building}, {duration}, {affected_count}, {remedy},
#            {stressor_narrative}, {detection_narrative}, {political_narrative}

water:
  - story: >
      The {building} in {district} has been non-functional for {duration}.
      {detection_narrative} Residents have been carrying water from neighbouring
      districts, straining those systems in turn.
    tone: factual

  - story: >
      Guild of Engineers blames Patrician's budget cuts for the water failure
      in {district}. Patrician's office points to ageing infrastructure inherited
      from previous administration. Neither acknowledges the residents still
      without water.
    tone: political

energy:
  - story: >
      The power supply to {district} has been unstable for {duration}. Businesses
      have suspended operations, and households are without heating. The
      {stressor_narrative}.
    tone: factual

  - story: >
      Competing narratives emerge around the {district} blackout. Activists claim
      it proves underinvestment. The Sto Plains press frames it as Ankh-Morpork
      incompetence. The truth, as usual, is more complicated and less interesting.
    tone: analytical

communications:
  - story: >
      With the clacks tower serving {district} down, services are struggling to
      coordinate. Citizens have lost access to information, and rumours are
      filling the void. {political_narrative}
    tone: ominous

  - story: >
      The Watch investigation into repeated clacks failures in {district} has
      found "no clear cause." This is either reassuring or terrifying, depending
      on your perspective.
    tone: wry

transport:
  - story: >
      The bridge closure has left {district} residents stranded. Workers cannot
      reach their jobs in the Merchant Quarter, and local businesses report a
      sharp drop in custom. Some residents have resorted to unsafe river crossings.
    tone: urgent

public_services:
  - story: >
      Lady Sybil Free Hospital has been forced to turn away non-emergency patients
      for {duration}. Staff are working double shifts. The Regulatory Committee
      has demanded an explanation. Commander Vimes has been seen pacing the corridors.
    tone: grave

commercial:
  - story: >
      The beer supply chain has collapsed after the main brewery ceased production.
      Tavern owners report empty cellars and restless customers. The Mended Drum
      is serving "imported alternatives" at triple the price.
    tone: alarming

food:
  - story: >
      The {building} has been unable to supply {district} for {duration}.
      Residents report empty shelves and rising prices. Those who can afford
      alternatives are buying them. Those who cannot are waiting.
      {stressor_narrative}
    tone: factual

  - story: >
      The food shortage in {district} has produced the usual competing explanations.
      The Shambles Guild blames the Sto Plains drought. The Sto Plains traders blame
      the bridge tolls. The bridge toll collectors blame the weather. Residents
      are eating less while the blame circulates.
    tone: political

fire:
  - story: >
      A fire broke out at {building} and spread to adjacent properties before the
      fire post in {district} could respond. {detection_narrative} By the time
      engines arrived, three structures were involved. The inadequate pump was
      located after the fact.
    tone: urgent

  - story: >
      The {district} fire post has been understaffed and under-equipped for years.
      Last night's fire was not a surprise to anyone who had looked at the maintenance
      logs — if the logs existed, and if anyone had looked.
      {political_narrative}
    tone: ominous

security:
  - story: >
      The Watch post in {district} has been closed or understaffed for {duration}.
      During that period, the Thieves' Guild reports an increase in what they describe
      as "spontaneous voluntary transactions." Residents describe it differently.
      {detection_narrative}
    tone: urgent

  - story: >
      Commander Vimes has submitted his fourteenth budget request for additional
      Watch officers in {district}. The first thirteen were declined, deferred,
      or lost. The current crime rate in {district} is attached as supporting evidence.
      The Palace has acknowledged receipt of the document.
    tone: wry

workshop:
  - story: >
      {building} in {district} has suspended production after {duration} of
      disruption. Employees have not been paid. The guild licensing office
      reports the paperwork is "under review." {stressor_narrative}
    tone: factual

  - story: >
      The workshop closures in {district} are following the familiar pattern.
      First the power goes. Then the orders stop. Then the workers leave.
      Then someone from Nap Hill buys the building for storage.
    tone: analytical

tech:
  - story: >
      Systems at {building} have been unavailable for {duration}. Three guild
      clients, the Royal Bank, and the Patrician's correspondence office were
      affected. The public-facing explanation is "scheduled maintenance."
      No maintenance was scheduled.
    tone: analytical

  - story: >
      The clacks outage that started at {building} has now affected eleven
      dependent systems. The Watch discovered this by trying to send a message
      and receiving nothing back. The silence, they note, is unusual. Usually
      there is at least static.
    tone: ominous

detection_narratives:
  immediate: "The failure was noticed immediately."
  delayed_citizen: "Residents reported the problem after {delay} hours of waiting."
  delayed_media: "The Ankh-Morpork Times broke the story after {delay} hours."
  delayed_cascade: "The failure was only discovered when it caused problems elsewhere."
  delayed_vimes: "Commander Vimes discovered the problem during a personal visit."
  never_reported: "No one reported the failure. It was discovered by accident."
  pride_concealment: "Residents concealed the problem out of pride. It was {delay} hours before anyone outside the district knew."

political_narratives:
  nobles_complain: "Lord Rust has written three letters to the Patrician this week."
  guilds_demand: "The Guild of {guild} has formally demanded action."
  media_pressure: "The Ankh-Morpork Times is running a daily series on the crisis."
  vimes_involved: "Commander Vimes has taken a personal interest."
  moist_assigned: "Moist von Lipwig has been 'asked' to look into it."
  patrician_acts: "A note arrived at the relevant office. By morning, things had changed. No one was told what the note said."
  thieves_guild_opportunism: "The Thieves' Guild has noted the gap in Watch coverage and adjusted its operations accordingly."
  uu_deflects: "Unseen University has declined to comment. The Archchancellor was unavailable. The Librarian was available but unhelpful."
  silence: "The Palace has said nothing. The silence is deafening."