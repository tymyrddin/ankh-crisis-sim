# --- Ideological Disruption ---
- id: guild_strike
  name: "Guild strike"
  category: ideological_disruption
  target_building_types: [guild_hq]
  domain: commercial
  probability_base: 0.004
  stressor_amplifiers:
    organisational_fragmentation: 1.5
    social_inequality: 1.4          # inequality drives labour grievances
    underinvestment: 1.2            # deferred wages and conditions compound resentment
  impact:
    immediate:
      - metric: public_trust
        delta: -10
      - metric: political_stability
        delta: -8
      - metric: regulatory_pressure
        delta: 10
    secondary:
      delay_hours: 48
      effects:
        - metric: legitimacy
          delta: -3
  headlines:
    - "{building} announces strike action"
    - "Guild members down tools; markets in chaos"
  stories:
    - "The {building} has declared a work stoppage over {stressor_narrative}. Markets are in disarray."

# --- Strategic Interference ---
- id: repeated_small_outages
  name: "Suspicious repeated outages"
  category: strategic_interference
  target_building_types: [clacks_tower, communications_office, tech_business]
  domain: communications
  probability_base: 0.0025
  impact:
    immediate:
      - metric: local_trust
        delta: -2
        scope: district
    secondary:
      delay_hours: 168              # one week
      effects:
        - metric: public_trust
          delta: -8
        - metric: regulatory_pressure
          delta: 10
        - metric: political_stability
          delta: -5
  headlines:
    - "Another clacks outage in {district}; third this month"
    - "Pattern of failures raises questions"
  stories:
    - "Repeated small failures in {district}'s communication infrastructure have experts worried. The Watch investigation found 'no clear cause'."

- id: tech_system_compromise
  name: "Technical system compromise"
  category: strategic_interference
