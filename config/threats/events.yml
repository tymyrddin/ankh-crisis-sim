# Event templates — concrete incidents that can occur

# --- Degradation and Neglect ---
- id: pump_failure
  name: "Water pump failure"
  category: degradation_and_neglect
  target_building_types: [slum_dwelling, middle_class_housing]
  domain: water
  probability_base: 0.003
  stressor_amplifiers:
    underinvestment: 2.0
  impact:
    immediate:
      - metric: local_trust
        delta: -5
        scope: district
    secondary:
      delay_hours: 48
      effects:
        - metric: public_trust
          delta: -3
    duration_penalty:
      per_day_unresolved: -2
      metric: local_trust
  cascade:
    dependency: water
    propagate_to: neighbours
  headlines:
    - "Water pump fails in {district}"
    - "{building} runs dry"
  stories:
    - "Residents of {district} have been without clean water for {duration}. {detection_narrative}"

- id: power_outage
  name: "Rolling power outage"
  category: degradation_and_neglect
  target_building_types: [middle_class_housing, guild_hq, civic_institution]
  domain: energy
  probability_base: 0.002
  stressor_amplifiers:
    underinvestment: 1.8
  impact:
    immediate:
      - metric: local_trust
        delta: -3
        scope: district
    secondary:
      delay_hours: 24
      effects:
        - metric: public_trust
          delta: -5
        - metric: regulatory_pressure
          delta: 3
  cascade:
    dependency: energy
    propagate_to: all_dependents
  headlines:
    - "Power outage hits {district}"
    - "Blackout across {district}; businesses suspend operations"
  stories:
    - "Unstable power supply in {district} has left {affected_count} buildings without electricity for {duration}."

