# Event templates:concrete incidents that can occur

# --- Degradation and Neglect ---
- id: pump_failure
  name: "Water pump failure"
  category: degradation_and_neglect
  target_building_types: [water_source]
  domain: water
  probability_base: 0.015
  stressor_amplifiers:
    underinvestment: 2.0
  impact:
    immediate:
      - metric: local_trust
        delta: -5
        scope: district
    secondary:
      delay_hours: 48
      effects:
        - metric: public_trust
          delta: -3
        - metric: public_health
          delta: -5                   # contamination and disease risk
    duration_penalty:
      per_day_unresolved: -1
      metric: local_trust
  cascade:
    dependency: water
    propagate_to: neighbours
  headlines:
    - "Water pump fails in {district}"
    - "{building} runs dry"
  stories:
    - "Residents of {district} have been without clean water for {duration}. {detection_narrative}"

- id: power_outage
  name: "Rolling power outage"
  category: degradation_and_neglect
  target_building_types: [power_source]
  domain: energy
  probability_base: 0.010
  stressor_amplifiers:
