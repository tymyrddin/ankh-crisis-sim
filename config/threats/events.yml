  impact:
    immediate:
      - metric: local_trust
        delta: -3
        scope: district
      - metric: regulatory_pressure
        delta: 10
    secondary:
      delay_hours: 24
      effects:
        - metric: public_trust
          delta: -12
        - metric: legitimacy
          delta: -8
        - metric: political_stability
