- id: hospital_outage
  name: "Hospital system outage"
  category: degradation_and_neglect
  target_building_types: [healthcare]
  target_buildings: [lady_sybil_hospital]
  domain: public_services
  probability_base: 0.004
  stressor_amplifiers:
    underinvestment: 2.0
  impact:
    immediate:
      - metric: public_trust
        delta: -15
      - metric: regulatory_pressure
        delta: 12
      - metric: public_health
        delta: -15                    # people cannot get treated
    secondary:
      delay_hours: 24
      effects:
        - metric: legitimacy
          delta: -5
        - metric: political_stability
          delta: -5
        - metric: public_health
          delta: -5                   # ongoing deterioration without care
    duration_penalty:
      per_day_unresolved: -2.5
      metric: public_trust
  headlines:
    - "Lady Sybil Free Hospital forced to divert patients"
    - "Hospital crisis: power failure threatens lives"
  stories:
    - "Lady Sybil Free Hospital has been forced to turn away patients after a critical system failure. Lives may be at risk."

- id: watch_understaffing
  name: "Watch post understaffing"
  category: degradation_and_neglect
  target_building_types: [security]
  domain: security
  probability_base: 0.008
  stressor_amplifiers:
    underinvestment: 1.8
    criminal_target: 1.5
  impact:
    immediate:
      - metric: local_trust
        delta: -4
        scope: district
      - metric: crime_level
        delta: 8                      # unlicensed activity fills the vacuum immediately
    secondary:
      delay_hours: 48
      effects:
        - metric: public_trust
          delta: -8
        - metric: political_stability
          delta: -3
    duration_penalty:
      per_day_unresolved: -1.5
      metric: local_trust
  cascade:
    dependency: security
    propagate_to: neighbours
  headlines:
    - "Watch post in {district} closed; area unpatrolled"
    - "{building} understaffed; crime rising in {district}"
  stories:
    - "The Watch post in {district} has been closed or understaffed for {duration}. During that period, the Thieves' Guild reports an increase in what they describe as 'spontaneous voluntary transactions.' Residents describe it differently. {political_narrative}"

