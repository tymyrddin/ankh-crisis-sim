  domain: tech
  probability_base: 0.003
  stressor_amplifiers:
    vendor_monoculture: 2.5
    organisational_fragmentation: 1.5
  impact:
    immediate:
      - metric: local_trust
        delta: -5
        scope: district
      - metric: regulatory_pressure
        delta: 8
    secondary:
