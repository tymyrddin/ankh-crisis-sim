# --- Ideological Disruption ---
- id: guild_strike
  name: "Guild strike"
  category: ideological_disruption
  target_building_types: [guild_hq]
  domain: commercial
  probability_base: 0.0008
  stressor_amplifiers:
    organisational_fragmentation: 1.5
  impact:
    immediate:
      - metric: public_trust
        delta: -10
      - metric: political_stability
        delta: -8
      - metric: regulatory_pressure
        delta: 10
    secondary:
      delay_hours: 48
      effects:
        - metric: legitimacy
          delta: -3
