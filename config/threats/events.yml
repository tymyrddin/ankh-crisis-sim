# --- Operational Error ---
- id: misconfigured_upgrade
  name: "Botched system upgrade"
  category: operational_error
  target_building_types: [tech_business, communications_office, clacks_tower]
  domain: communications
  probability_base: 0.005
  stressor_amplifiers:
    organisational_fragmentation: 1.5
    underinvestment: 1.3
  impact:
    immediate:
      - metric: local_trust
        delta: -5
        scope: district
      - metric: regulatory_pressure
        delta: 5
    secondary:
      delay_hours: 24
      effects:
        - metric: public_trust
          delta: -8
  cascade:
    dependency: communications
    propagate_to: neighbours      # vendor_monoculture escalates to city-wide when Grand Trunk is the only carrier
  headlines:
    - "System upgrade goes wrong at {building}"
    - "Services disrupted after 'routine maintenance' at {building}"
  stories:
    - "A planned upgrade at {building} caused an unexpected outage. Recovery is taking longer than anticipated."

- id: workshop_fire
  name: "Workshop industrial fire"
  category: operational_error
  target_building_types: [workshop]
  domain: fire
  probability_base: 0.006
  stressor_amplifiers:
    underinvestment: 1.8
    criminal_target: 1.2
  impact:
    immediate:
      - metric: local_trust
        delta: -8
        scope: district
      - metric: regulatory_pressure
        delta: 6
      - metric: public_health
        delta: -3                     # injuries, smoke inhalation, displacement
    secondary:
      delay_hours: 24
      effects:
        - metric: public_trust
          delta: -10
        - metric: political_stability
          delta: -3
  cascade:
    dependency: public_safety
    propagate_to: neighbours
  headlines:
    - "Workshop fire threatens {district} street"
    - "Fire at {building} spreads to adjacent properties"
  stories:
    - "A fire broke out at {building} and spread to adjacent properties before the fire post in {district} could respond. {detection_narrative} By the time engines arrived, three structures were involved."

# --- Supply Chain ---
- id: brewery_failure
  name: "Brewery supply chain collapse"
  category: supply_chain_failure
  target_building_types: [brewery]
  domain: commercial
  probability_base: 0.005
  stressor_amplifiers:
    just_in_time: 2.0
    vendor_monoculture: 1.5
  impact:
    immediate:
      - metric: local_trust
        delta: -3
        scope: district
    secondary:
      delay_hours: 72
      effects:
        - metric: public_trust
          delta: -5
  cascade:
    dependency: brewery_supply
    propagate_to: all_dependents
  headlines:
    - "Beer shortage hits {district}"
    - "Brewery shutdown threatens city's beer supply"
  stories:
    - "The main brewery supplying {district}'s taverns has ceased production. The Mended Drum reports empty cellars."

- id: food_supply_disruption
  name: "Food supply disruption"
  category: supply_chain_failure
  target_building_types: [food_supply]
  domain: food
  probability_base: 0.008
  stressor_amplifiers:
    just_in_time: 2.0
    underinvestment: 1.5
  impact:
    immediate:
      - metric: local_trust
        delta: -4
        scope: district
    secondary:
      delay_hours: 48
      effects:
        - metric: public_trust
          delta: -8
        - metric: political_stability
          delta: -4
        - metric: public_health
          delta: -6                   # malnutrition; hits low-wealth districts hardest
        - metric: crime_level
          delta: 3                    # economic desperation drives unlicensed activity
    duration_penalty:
      per_day_unresolved: -2
      metric: local_trust
  cascade:
    dependency: food_supplies
    propagate_to: neighbours
  headlines:
    - "Food supply disrupted in {district}"
    - "{building} unable to meet demand"
  stories:
    - "The {building} has been unable to supply {district} for {duration}. Residents report empty shelves and rising prices. Those who cannot afford alternatives are waiting. {stressor_narrative}"

