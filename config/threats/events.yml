  domain: communications
  probability_base: 0.0005
  impact:
    immediate:
      - metric: local_trust
        delta: -2
        scope: district
    secondary:
      delay_hours: 168              # one week
      effects:
        - metric: public_trust
          delta: -8
        - metric: regulatory_pressure
          delta: 10
        - metric: political_stability
          delta: -5
  headlines:
    - "Another clacks outage in {district}; third this month"
    - "Pattern of failures raises questions"
  stories:
    - "Repeated small failures in {district}'s communication infrastructure have experts worried. The Watch investigation found 'no clear cause'."

