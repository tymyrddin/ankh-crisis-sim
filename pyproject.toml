[project]
name = "ankh-crisis-sim"
version = "0.1.0"
description = "Ankh-Morpork: Lord Vetinari's Dilemmas, a crisis management simulation"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ankh-crisis-sim = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]